<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NBA Coordinator - Self Assessment</title>
    <script>
      // Force fetch to be writable: some environments (like AI Studio) protect it,
      // but some third-party libraries (or dev tools) try to wrap it and crash.
      (function() {
        var _fetch = window.fetch;
        try {
          Object.defineProperty(window, 'fetch', {
            get: function() { return _fetch; },
            set: function(v) { _fetch = v; },
            configurable: true,
            enumerable: true
          });
        } catch (e) {
          // If redefine fails, we are likely in a strictly protected environment.
          // We don't log anything to avoid confusing the user.
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
