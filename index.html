<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NBA Coordinator - Self Assessment</title>
    <script>
      // Force compatibility for environments where window.fetch has only a getter
      (function() {
        try {
          const original = window.fetch;
          if (original && !Object.getOwnPropertyDescriptor(window, 'fetch')?.set) {
            Object.defineProperty(window, 'fetch', {
              get: function() { return original; },
              set: function(v) { console.warn('Blocked attempt to overwrite read-only fetch'); },
              configurable: true,
              enumerable: true
            });
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
