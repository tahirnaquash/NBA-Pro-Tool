<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NBA Coordinator - Self Assessment</title>
    <script>
      // Safe fetch shim to prevent "has only a getter" errors from third-party scripts
      (function() {
        var originalFetch = window.fetch;
        try {
          Object.defineProperty(window, 'fetch', {
            get: function() { return originalFetch; },
            set: function() { /* ignore silent */ },
            configurable: true,
            enumerable: true
          });
        } catch (e) {
          console.warn('NBA: Fetch compatibility layer active');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
