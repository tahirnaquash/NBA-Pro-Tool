<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NBA Coordinator - Self Assessment</title>
    <script>
      (function() {
        try {
          var f = window.fetch;
          Object.defineProperty(window, 'fetch', {
            get: function() { return f; },
            set: function(v) { f = v; },
            configurable: true,
            enumerable: true
          });
        } catch (e) {
          // If we can't redefine fetch on window, try the prototype
          try {
            var proto = Object.getPrototypeOf(window);
            var desc = Object.getOwnPropertyDescriptor(proto, 'fetch');
            if (desc && desc.configurable) {
              Object.defineProperty(proto, 'fetch', {
                get: function() { return f; },
                set: function(v) { f = v; },
                configurable: true,
                enumerable: true
              });
            }
          } catch (e2) {}
        }
      })();
    </script>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
