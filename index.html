    <title>NBA Coordinator - Self Assessment</title>
    <script>
      // Ultimate safety shim for window.fetch
      (function() {
        var originalFetch = window.fetch;
        try {
          // Attempt to redefine if possible, or provide a silent setter
          var descriptor = Object.getOwnPropertyDescriptor(window, 'fetch');
          if (descriptor && !descriptor.set && descriptor.configurable) {
            Object.defineProperty(window, 'fetch', {
              get: function() { return originalFetch; },
              set: function() { /* Silently ignore - fixes read-only error */ },
              configurable: true,
              enumerable: true
            });
          }
        } catch (e) {
          console.warn('NBA: Safe environment check');
        }
      })();
    </script>
  </head>

    <div id="root"></div>
    <script type="module" src="src/main.tsx"></script>
  </body>
